name: Test xenOS

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    name: C3 unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the C3 compiler
        run: |
          curl --fail --location --silent --show-error https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux.tar.gz | sudo tar -xz -C /opt
          echo /opt/c3 >> "$GITHUB_PATH"
          /opt/c3/c3c --version
      - name: Run C3 unit tests
        run: ./scripts/test.sh

  boot:
    # QEMU boot verification. The cross-musl userspace sysroot is NOT needed to
    # build a bootable image; build.sh auto-bootstraps all host tools via
    # scripts/bootstrap.sh (project-local .toolchain/). Provisions the sysroot
    # as best-effort so the desktop (GTK/Xfce/labwc) paths may exercise too.
    name: QEMU boot verification
    runs-on: ubuntu-24.04
    needs: unit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the C3 compiler
        run: |
          curl --fail --location --silent --show-error https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux.tar.gz | sudo tar -xz -C /opt
          echo /opt/c3 >> "$GITHUB_PATH"
      - name: Provision host tools
        run: ./scripts/bootstrap.sh host
      - name: Build boot image
        run: |
          ./build.sh
          [ -f build/xenos.img ] || { echo "build did not produce xenos.img"; exit 1; }
      - name: Verify a headless QEMU boot
        run: |
          [ -f build/xenos.img ] || { echo "boot image missing; nothing to verify"; exit 1; }
          timeout 120s ./scripts/boot_verify.sh